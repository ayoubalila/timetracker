name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test + coverage ─────────────────────────────────────────
  backend:
    name: Backend (Kotlin / Spring Boot)
    runs-on: self-hosted
    container:
      image: eclipse-temurin:21-jdk-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: ktlint check
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run tests + coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          retention-days: 3

  # ── Frontend: lint + test + coverage ────────────────────────────────────────
  frontend:
    name: Frontend (React / TypeScript)
    runs-on: self-hosted
    container:
      image: node:24-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test + coverage
        working-directory: frontend
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3
