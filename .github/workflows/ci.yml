name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test + coverage ─────────────────────────────────────────
  backend:
    name: Backend (Kotlin / Spring Boot)
    runs-on: self-hosted
    container:
      image: eclipse-temurin:21-jdk-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: ktlint check
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run tests + coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          retention-days: 3

  # ── Frontend: lint + test + coverage ────────────────────────────────────────
  frontend:
    name: Frontend (React / TypeScript)
    runs-on: self-hosted
    container:
      image: node:24-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test + coverage
        working-directory: frontend
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3

  # ── System: Playwright E2E against a real backend + frontend ───────────────
  system:
    name: System (Playwright)
    runs-on: self-hosted
    needs: [backend, frontend]
    # Runs in the official Playwright image, pinned to the exact @playwright/test version
    # in e2e/package-lock.json (1.61.1), so the bundled Firefox build always matches what
    # the tests were written/run against — no `playwright install` step needed, which is
    # what previously required interactive root/sudo on the runner and broke CI. Running
    # this job in a container also keeps ownership consistent with the backend/frontend
    # containers above (all run as root), so no extra workspace-ownership fixup is needed.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # A `services:` container is wired onto *this job's own* container network by GitHub
    # Actions and is reachable at the service id as hostname (not `localhost` — that only
    # works when the job itself runs directly on the runner host). See E2E_DB_HOST/PORT
    # below and playwright.config.ts, which point the backend's datasource at db-test:5432.
    services:
      db-test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timetracker_test
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U timetracker"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      E2E_DB_HOST: db-test
      E2E_DB_PORT: '5432'
      # GitHub Actions bind-mounts /github/home into every containerized job on this
      # self-hosted runner and forces HOME=/github/home, regardless of the image's
      # default user. That directory is owned by a uid the playwright image's
      # /etc/passwd resolves to "pwuser", but this job's container runs as root, so
      # Firefox's namespace sandbox refuses to launch ("$HOME is /github/home which
      # is owned by pwuser"). Firefox's own error message documents the fix: point
      # HOME at a directory root actually owns. Set job-wide (not just on `npm test`)
      # so the earlier Gradle/npm cache steps and the gradlew bootRun / vite dev
      # webServer children that `npm test` spawns all agree on the same HOME.
      HOME: /root

    steps:
      - uses: actions/checkout@v4

      # The Playwright image bundles Node.js but not a JDK, which the backend's
      # `gradlew bootRun` webServer needs.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: java -version && node --version && npm --version

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Verify Playwright/browser versions match the pinned image
        working-directory: e2e
        run: npx playwright --version

      - name: Run Playwright system tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 3
