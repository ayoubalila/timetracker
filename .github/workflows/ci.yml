name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test + coverage ─────────────────────────────────────────
  backend:
    name: Backend (Kotlin / Spring Boot)
    runs-on: self-hosted
    container:
      image: eclipse-temurin:21-jdk-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: ktlint check
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run tests + coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          retention-days: 3

  # ── Frontend: lint + test + coverage ────────────────────────────────────────
  frontend:
    name: Frontend (React / TypeScript)
    runs-on: self-hosted
    container:
      image: node:24-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test + coverage
        working-directory: frontend
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3

  # ── System: Playwright E2E against a real backend + frontend ───────────────
  system:
    name: System (Playwright)
    runs-on: self-hosted
    needs: [backend, frontend]
    # Same container approach as the backend/frontend jobs above: this job previously ran
    # directly on the runner host, which — unlike the containerized jobs above, which run
    # as root — couldn't clean up root-owned files left in the shared workspace by them.
    container:
      image: node:24-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install JDK and Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends openjdk-21-jdk-headless docker.io docker-compose-plugin
          rm -rf /var/lib/apt/lists/*

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps firefox

      - name: Start dedicated test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run Playwright system tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 3

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
