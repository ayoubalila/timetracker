name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test + coverage ─────────────────────────────────────────
  backend:
    name: Backend (Kotlin / Spring Boot)
    runs-on: self-hosted
    container:
      image: eclipse-temurin:21-jdk-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: ktlint check
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run tests + coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          retention-days: 3

  # ── Frontend: lint + test + coverage ────────────────────────────────────────
  frontend:
    name: Frontend (React / TypeScript)
    runs-on: self-hosted
    container:
      image: node:24-bookworm-slim

    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test + coverage
        working-directory: frontend
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3

  # ── System: Playwright E2E against a real backend + frontend ───────────────
  system:
    name: System (Playwright)
    runs-on: self-hosted
    needs: [backend, frontend]
    # Runs directly on the runner host (Java/Node/Docker are all assumed present per the
    # course's grading-environment spec) rather than in a container: containers started
    # from *inside* a containerized job (whether via `docker compose` through the mounted
    # host socket, or a `services:` container) are not reachable at localhost from inside
    # that job's own container network namespace. On a host-based job, by contrast, a
    # `services:` container's published port is just an ordinary host port.
    services:
      db-test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timetracker_test
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U timetracker"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      # backend/frontend run in containers as root; when this job reuses the same shared
      # runner workspace, actions/checkout's cleanup step can't remove the root-owned files
      # they left behind. Hand ownership back with a throwaway container first.
      - name: Fix workspace ownership left by prior containerized jobs
        run: docker run --rm -v "${{ github.workspace }}:/workspace" alpine chown -R $(id -u):$(id -g) /workspace

      - uses: actions/checkout@v4

      # The bare runner host only has git + Docker; Java/Node live in the per-job container
      # images used by the backend/frontend jobs above, not on the host itself — don't
      # assume either is present here.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: java -version && node --version && npm --version

      - name: Cache Gradle wrapper and caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps firefox

      - name: Run Playwright system tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 3
