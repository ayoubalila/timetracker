spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/timetracker}
    username: ${DB_USER:timetracker}
    password: ${DB_PASS:timetracker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:ZmFsbHNlY3JldGtleWZhbGxzZWNyZXRrZXlmYWxsc2VjcmV0a2V5ZmFsbHNlY3JldA==}
    expiration-ms: 86400000

server:
  port: 8080
  error:
    include-message: always
