# PostgreSQL only — used for local integration tests that need a real DB.
# Start with: docker compose -f docker-compose.test.yml up -d
# Stop with:  docker compose -f docker-compose.test.yml down -v
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timetracker_test
      POSTGRES_USER: timetracker
      POSTGRES_PASSWORD: timetracker
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker"]
      interval: 3s
      timeout: 3s
      retries: 10
